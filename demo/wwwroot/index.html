<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor.ThreeJS.Demo</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!--
    DON'T PUT ANY ADDITIONAL CSS OR JAVASCRIPT LINKS IN THIS FILE.
    Please do that in the "iframe.html" instead.
    -->
    <link rel="stylesheet" href="css/blazor-ui.css" />
    <script type="importmap"></script>
    <script>
        // BlazingStory exposes no parameter for the addon panel's default position - it only
        // persists whatever the user last toggled. Seeding the same storage key before boot
        // makes "right" the default, while an existing value (the user's own choice) is kept.
        // SplitterOrientation: 0 = bottom, 1 = right.
        (function () {
            var key = 'CanvasPage._AddonPanelLayout';
            if (localStorage.getItem(key) === null) {
                localStorage.setItem(key, JSON.stringify({
                    SplitterOrientation: 1,
                    HorizontalProportion: 50,
                    VerticalProportion: 50
                }));
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg>
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="text"></div>
            <img src="_content/BlazingStory/images/icon.min.svg" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!--
    DON'T PUT ANY ADDITIONAL JAVASCRIPT LINKS IN THIS FILE.
    Please do that in the "iframe.html" instead.
    -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
