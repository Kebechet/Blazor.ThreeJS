name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION_PATH: src/Blazor.ThreeJS.slnx
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # The extractor needs the pinned @types/three and TypeScript. The wire-format test below needs
    # neither - it drives the three.js bundle vendored into wwwroot, the copy that actually ships.
    - name: Install the pinned type sources
      run: npm ci

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    # The golden check one level upstream of the one below: it re-reads @types/three and fails if the
    # result differs from the committed generator/three-api.json. Without it nothing guards sources ->
    # IR, so a change to the extractor - or a drift in the pinned types - could land with a stale
    # snapshot and a green build, and every figure downstream would describe the old surface.
    - name: Check the extracted API snapshot is up to date
      run: npm run extract:check

    # The golden check for the code generator: it re-emits from generator/three-api.json and fails if
    # the result differs from what is committed under src/Blazor.ThreeJS/Generated. A change to the
    # emitter that changes its output has to land together with the regenerated files, so the diff
    # of generated code is always reviewed rather than discovered later.
    - name: Check the generated code is up to date
      run: npm run emit:check

    # The addons are hand-vendored out of node_modules/three/examples/jsm, so nothing else would
    # notice a three.js bump leaving them behind. This re-derives them and fails if the committed
    # copies differ - and it re-walks their imports, so an addon that grows a new sibling dependency
    # fails here rather than as ERR_MODULE_NOT_FOUND in a consumer's browser.
    - name: Check the vendored addons are up to date
      run: npm run vendor:check

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

    # This is the only automated check on the C#<->JS wire contract: it drives the vendored
    # three.js bundle directly against fixtures the C# serializer test asserts too, so a change to
    # either side that the other does not follow fails here rather than only at runtime.
    - name: Test the wire format
      run: node tests/wire-format.test.mjs

    # Every other test serves the demo from the root, where a root-absolute URL happens to resolve.
    # GitHub Pages serves it from /Blazor.ThreeJS/, where the same URL 404s - so this is the only
    # check that would catch an asset the deployed site cannot fetch.
    - name: Check the demo survives a sub-path deploy
      run: node tests/demo-base-path.test.mjs

    # No coverage collection here: --collect is a VSTest flag and this project's test host is
    # Microsoft.Testing.Platform (TestingPlatformDotnetTestSupport + xunit.v3.mtp-v2), which
    # rejects it outright. MTP has its own coverage extension (Microsoft.Testing.Extensions.
    # CodeCoverage, --coverage), but wiring that up still needs a Codecov token this repo does not
    # have, so coverage is deliberately left out for now rather than shipped half-configured.
    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }}
